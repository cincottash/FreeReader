# Builds FreeReader for Windows (a single FreeReader.exe) and Linux (FreeReader-x86_64.AppImage), and the phone app
# for Android (an APK kept with the run only, for now).
#
# - Pull requests and manual runs: build both, check that each starts, and keep them as downloadable artifacts of
#   the run for 14 days (nothing is published).
# - Every merge into main: the same, then publish a GitHub Release with both files attached, tagged with the next
#   version (v1.1.1 -> v1.1.2). Put [minor] or [major] in the PR title for v1.2.0 or v2.0.0 instead.
# - A version tag pushed by hand (git tag v1.5.0; git push origin v1.5.0) also publishes a release.

name: Build apps

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

env:
  # PDF and XPS: MuPDF (AGPL-3.0), built from its source with these switches (no HTML engine, no JavaScript, no
  # fallback fonts: FreeReader reads the text and draws pages, it doesn't need them).
  MUPDF_VERSION: "1.28.6"
  MUPDF_SHA256: dc85000640a45d90ca9b77b061f6ca67cce0c4d4fbecf8819647baf573eef101
  MUPDF_FLAGS: >-
    build=release OUT=build/freereader html=no mujs=no brotli=no extract=no tofu=yes tofu_cjk=yes
    HAVE_X11=no HAVE_GLUT=no HAVE_CURL=no HAVE_LIBCRYPTO=no
    USE_SYSTEM_FREETYPE=yes USE_SYSTEM_ZLIB=yes USE_SYSTEM_LIBJPEG=yes USE_SYSTEM_HARFBUZZ=yes

# Runs that publish (merges into main, version tags) wait for each other: the version is worked out at the start
# of a run, so two merges a few minutes apart would otherwise both pick the same number, and the second release
# would fail. A run that waits starts only after the one before it has published, and so sees its tag.
# GitHub keeps one waiting run per group: if a third merge comes while one is still waiting, the waiting one is
# cancelled and the newest one publishes, with the changes of both in its release.
# Pull requests and manual runs never wait (each gets a group of its own).
concurrency:
  group: ${{ github.event_name == 'push' && 'publish' || format('run-{0}', github.run_id) }}
  cancel-in-progress: false

permissions:
  contents: write          # needed to create the release
  pull-requests: read      # needed to read the merged pull request's title (for [minor] / [major])

jobs:
  version:
    name: Work out the version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # all tags, to find the latest version
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
          # The commit whose pull request is looked up: the branch's last commit on a pull request, else this commit
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"                     # a tag pushed by hand: use it as is
          else
            latest=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)
            latest=${latest:-v0.0.0}
            IFS=. read -r major minor patch <<< "${latest#v}"
            # Only titles, never descriptions: the merged commit's first line and the pull request's title.
            # They can differ: squash-merging a pull request with a single commit keeps that commit's first
            # line, not the pull request's title, so the title is asked for as well.
            message=$(git log -1 --format=%s "$GITHUB_SHA")
            pr_title=$(gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/pulls" --jq '.[0].title // ""' 2>/dev/null || true)
            echo "Commit title: $message"
            echo "Pull request title: ${pr_title:-(none found)}"
            if grep -qi '\[major\]' <<< "$message $pr_title"; then
              version="$((major + 1)).0.0"
            elif grep -qi '\[minor\]' <<< "$message $pr_title"; then
              version="${major}.$((minor + 1)).0"
            else
              version="${major}.${minor}.$((patch + 1))"
            fi
            if [[ "$GITHUB_EVENT_NAME" != "push" ]]; then
              version="${version}-test.${GITHUB_RUN_NUMBER}"   # pull requests and manual runs
            fi
            echo "Latest release tag: $latest"
          fi
          echo "Version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  windows:
    name: Windows .exe
    needs: version
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf mingw-w64-ucrt-x86_64-qt6-static
            mingw-w64-ucrt-x86_64-libtiff mingw-w64-ucrt-x86_64-libwebp
            mingw-w64-ucrt-x86_64-harfbuzz mingw-w64-ucrt-x86_64-freetype mingw-w64-ucrt-x86_64-libpng
            mingw-w64-ucrt-x86_64-zlib mingw-w64-ucrt-x86_64-pcre2 mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-libb2 mingw-w64-ucrt-x86_64-brotli mingw-w64-ucrt-x86_64-bzip2
            mingw-w64-ucrt-x86_64-libjpeg-turbo mingw-w64-ucrt-x86_64-sqlite
            mingw-w64-ucrt-x86_64-libarchive
            mingw-w64-ucrt-x86_64-djvulibre mingw-w64-ucrt-x86_64-chmlib make

      - uses: actions/cache@v4
        id: mupdf
        with:
          path: mupdf
          key: mupdf-${{ env.MUPDF_VERSION }}-mingw-${{ hashFiles('.github/workflows/build-apps.yml') }}

      - name: MuPDF (PDF and XPS)
        if: steps.mupdf.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o mupdf.tar.gz "https://mupdf.com/downloads/archive/mupdf-${MUPDF_VERSION}-source.tar.gz"
          echo "${MUPDF_SHA256}  mupdf.tar.gz" | sha256sum -c
          tar -xzf mupdf.tar.gz
          mv "mupdf-${MUPDF_VERSION}-source" mupdf
          # ARCH_HAS_SSE=0: the SSE 4.1 deskew code (for scanning, not reading) doesn't build without -msse4.1.
          make -C mupdf -j4 OS=MINGW $MUPDF_FLAGS XCFLAGS=-DARCH_HAS_SSE=0 libs
          # Only the headers and the two libraries are kept (and cached).
          find mupdf -mindepth 1 -maxdepth 1 ! -name include ! -name build -exec rm -rf {} +
          find mupdf/build/freereader -type f ! -name '*.a' -delete
          ls -l mupdf/build/freereader/*.a

      - name: Build the .exe (one self-contained file)
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSTATIC_BUILD=ON \
            -DCMAKE_PREFIX_PATH=/ucrt64/qt6-static -DRELEASE_VERSION=${{ needs.version.outputs.version }} \
            -DMUPDF_DIR="$PWD/mupdf"
          cmake --build build
          # Every format library linked in: 7-Zip and RAR comics, PDF and XPS, DjVu, CHM.
          for f in HAVE_LIBARCHIVE HAVE_MUPDF HAVE_DJVU HAVE_CHMLIB; do
            grep -q "$f" build/build.ninja || { echo "built without $f"; exit 1; }
          done
          mkdir -p dist
          cp build/FreeReader.exe dist/
          ls -l dist
          # Fail if the exe needs any DLL that isn't part of Windows.
          if objdump -p dist/FreeReader.exe | grep "DLL Name" | grep -iE "lib(stdc|gcc|winpthread|png|z|freetype|harfbuzz|crypto)|Qt6"; then
            echo "The exe depends on DLLs that aren't part of Windows"; exit 1
          fi

      - name: Check the .exe starts
        shell: pwsh
        run: |
          $data = New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\appdata"
          # Draws the window off-screen to a picture and exits: proves Qt, its plugins and the UI all load.
          $p = Start-Process dist/FreeReader.exe -ArgumentList "--screenshot", "$env:RUNNER_TEMP\shot.png" -PassThru -Wait
          if ($p.ExitCode -ne 0 -or -not (Test-Path "$env:RUNNER_TEMP\shot.png")) { throw "The screenshot check failed (exit $($p.ExitCode))" }
          # A PDF opens (MuPDF is in the exe): a one-page PDF written here.
          $pdf = "$env:RUNNER_TEMP\hola.pdf"
          Set-Content -Path $pdf -Encoding ascii -Value @(
            '%PDF-1.4', '1 0 obj <</Type /Catalog /Pages 2 0 R>> endobj', '2 0 obj <</Type /Pages /Kids [3 0 R] /Count 1>> endobj',
            '3 0 obj <</Type /Page /Parent 2 0 R /MediaBox [0 0 300 200] /Contents 4 0 R /Resources <</Font <</F1 5 0 R>>>>>> endobj',
            '4 0 obj <</Length 44>> stream', 'BT /F1 18 Tf 20 100 Td (Hola mundo) Tj ET', 'endstream endobj',
            '5 0 obj <</Type /Font /Subtype /Type1 /BaseFont /Helvetica>> endobj', 'trailer <</Root 1 0 R>>', '%%EOF')
          $p = Start-Process dist/FreeReader.exe -ArgumentList "`"$pdf`"", "--screenshot", "$env:RUNNER_TEMP\pdf.png" -PassThru -Wait
          if ($p.ExitCode -ne 0 -or -not (Test-Path "$env:RUNNER_TEMP\pdf.png")) { throw "The exe couldn't open a PDF (exit $($p.ExitCode))" }
          "A PDF opened"
          # Hear Pronunciation: Windows' speech engine (SAPI) is in the exe.
          $p = Start-Process dist/FreeReader.exe -ArgumentList "--check-speech", "$env:RUNNER_TEMP\speech.txt" -PassThru -Wait
          Get-Content "$env:RUNNER_TEMP\speech.txt"
          if (-not (Select-String -Path "$env:RUNNER_TEMP\speech.txt" -Pattern "sapi" -Quiet)) { throw "No speech engine in the exe" }
          # Starts normally and keeps running.
          $env:QT_QPA_PLATFORM = "offscreen"
          $p = Start-Process dist/FreeReader.exe -ArgumentList "--data-folder", "$data" -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) { throw "FreeReader.exe exited early with code $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force
          "FreeReader.exe started and kept running"

      - uses: actions/upload-artifact@v4
        with:
          name: FreeReader-windows
          path: dist/FreeReader.exe
          retention-days: 14

  linux:
    name: Linux AppImage
    needs: version
    # The oldest supported Ubuntu, so the AppImage also runs on older distributions.
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          # Hear Pronunciation: Qt TextToSpeech (and Qt Multimedia, which it needs), through speech-dispatcher.
          modules: "qtspeech qtmultimedia"
          cache: true

      - name: Install build tools and the libraries Qt needs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build libgl1-mesa-dev libegl1 libxkbcommon0 \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-render-util0 \
            libxcb-image0 libfontconfig1 libdbus-1-3 libfuse2 zlib1g-dev xvfb \
            libspeechd2 speech-dispatcher espeak-ng \
            libarchive-dev libwebp-dev libfreetype-dev libjpeg-dev libdjvulibre-dev libchm-dev

      - uses: actions/cache@v4
        id: mupdf
        with:
          path: mupdf
          key: mupdf-${{ env.MUPDF_VERSION }}-ubuntu-22.04-${{ hashFiles('.github/workflows/build-apps.yml') }}

      - name: MuPDF (PDF and XPS)
        if: steps.mupdf.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o mupdf.tar.gz "https://mupdf.com/downloads/archive/mupdf-${MUPDF_VERSION}-source.tar.gz"
          echo "${MUPDF_SHA256}  mupdf.tar.gz" | sha256sum -c
          tar -xzf mupdf.tar.gz
          mv "mupdf-${MUPDF_VERSION}-source" mupdf
          # -fPIC: linked into FreeReader, which is built position-independent.
          make -C mupdf -j4 $MUPDF_FLAGS XCFLAGS="-fPIC -DARCH_HAS_SSE=0" libs
          find mupdf -mindepth 1 -maxdepth 1 ! -name include ! -name build -exec rm -rf {} +
          find mupdf/build/freereader -type f ! -name '*.a' -delete
          ls -l mupdf/build/freereader/*.a

      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DRELEASE_VERSION=${{ needs.version.outputs.version }} \
            -DMUPDF_DIR="$PWD/mupdf"
          cmake --build build
          # Every format library: 7-Zip and RAR comics, WebP pages, PDF and XPS, DjVu, CHM.
          for f in HAVE_LIBARCHIVE HAVE_WEBP HAVE_MUPDF HAVE_DJVU HAVE_CHMLIB; do
            grep -q "$f" build/build.ninja || { echo "built without $f"; exit 1; }
          done

      - name: Package the AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"      # runners have no FUSE; AppImages unpack themselves instead
          EXTRA_PLATFORM_PLUGINS: libqoffscreen.so
          EXTRA_QT_MODULES: svg
        run: |
          curl -fsSL -o linuxdeploy https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -fsSL -o linuxdeploy-plugin-qt https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy linuxdeploy-plugin-qt
          # The app uses only the SQLite driver. The Qt plug-in would bundle every SQL driver, and some (Mimer,
          # MySQL, ODBC) need libraries that aren't installed, which stops the packaging.
          find "$QT_ROOT_DIR/plugins/sqldrivers" -type f ! -name 'libqsqlite.so' -print -delete
          # Speech only through speech-dispatcher (the system's voices); Qt Multimedia's playback plug-ins (FFmpeg)
          # aren't needed for that and would add their own large libraries.
          find "$QT_ROOT_DIR/plugins/texttospeech" -type f ! -name 'libqtexttospeech_speechd.so' -print -delete || true
          rm -rfv "$QT_ROOT_DIR/plugins/multimedia"
          cp resources/icon.svg FreeReader.svg
          ./linuxdeploy --appdir AppDir --executable build/FreeReader \
            --desktop-file packaging/linux/FreeReader.desktop --icon-file FreeReader.svg \
            --plugin qt
          # The speech plug-in, if the Qt plug-in for linuxdeploy didn't bring it.
          if [ ! -f AppDir/usr/plugins/texttospeech/libqtexttospeech_speechd.so ]; then
            mkdir -p AppDir/usr/plugins/texttospeech
            cp -v "$QT_ROOT_DIR/plugins/texttospeech/libqtexttospeech_speechd.so" AppDir/usr/plugins/texttospeech/
          fi
          ./linuxdeploy --appdir AppDir --deploy-deps-only AppDir/usr/plugins/texttospeech --output appimage
          find AppDir/usr/plugins -maxdepth 2 | sort
          mkdir -p dist
          mv FreeReader*.AppImage dist/FreeReader-x86_64.AppImage
          ls -l dist

      - name: Check the AppImage starts
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          QT_QPA_PLATFORM: offscreen
        run: |
          ./dist/FreeReader-x86_64.AppImage --screenshot "$RUNNER_TEMP/shot.png"
          test -s "$RUNNER_TEMP/shot.png"
          # A PDF opens (MuPDF is in the AppImage): a one-page PDF written here.
          printf '%s\n' '%PDF-1.4' '1 0 obj <</Type /Catalog /Pages 2 0 R>> endobj' '2 0 obj <</Type /Pages /Kids [3 0 R] /Count 1>> endobj' \
            '3 0 obj <</Type /Page /Parent 2 0 R /MediaBox [0 0 300 200] /Contents 4 0 R /Resources <</Font <</F1 5 0 R>>>>>> endobj' \
            '4 0 obj <</Length 44>> stream' 'BT /F1 18 Tf 20 100 Td (Hola mundo) Tj ET' 'endstream endobj' \
            '5 0 obj <</Type /Font /Subtype /Type1 /BaseFont /Helvetica>> endobj' 'trailer <</Root 1 0 R>>' '%%EOF' > "$RUNNER_TEMP/hola.pdf"
          ./dist/FreeReader-x86_64.AppImage "$RUNNER_TEMP/hola.pdf" --screenshot "$RUNNER_TEMP/pdf.png"
          test -s "$RUNNER_TEMP/pdf.png"
          echo "A PDF opened"
          ./dist/FreeReader-x86_64.AppImage --data-folder "$RUNNER_TEMP/appdata" &
          pid=$!
          sleep 20
          if ! kill -0 "$pid" 2>/dev/null; then wait "$pid"; echo "The AppImage exited early (code $?)"; exit 1; fi
          kill "$pid"
          echo "FreeReader-x86_64.AppImage started and kept running"
          # Hear Pronunciation: the speech-dispatcher engine is in the AppImage (voices depend on the system).
          ./dist/FreeReader-x86_64.AppImage --check-speech "$RUNNER_TEMP/speech.txt" || true
          cat "$RUNNER_TEMP/speech.txt"
          grep -q "speechd" "$RUNNER_TEMP/speech.txt"

      - name: Check it starts where Qt programs are told to use Wayland
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          # Many Wayland desktops set QT_QPA_PLATFORM=wayland. The AppImage has no Wayland plugin,
          # so it must pick XWayland's display by itself instead of aborting.
          xvfb-run -a env QT_QPA_PLATFORM=wayland XDG_SESSION_TYPE=wayland WAYLAND_DISPLAY=wayland-0 \
            ./dist/FreeReader-x86_64.AppImage --screenshot "$RUNNER_TEMP/wayland.png"
          test -s "$RUNNER_TEMP/wayland.png"
          xvfb-run -a env QT_QPA_PLATFORM="wayland;xcb" XDG_SESSION_TYPE=wayland \
            ./dist/FreeReader-x86_64.AppImage --screenshot "$RUNNER_TEMP/wayland2.png"
          test -s "$RUNNER_TEMP/wayland2.png"
          echo "Started through X11 with QT_QPA_PLATFORM=wayland"
          # No X display at all: a clear message and exit code 1, not a crash
          set +e
          out=$(env -u DISPLAY QT_QPA_PLATFORM=wayland XDG_SESSION_TYPE=wayland \
                ./dist/FreeReader-x86_64.AppImage --screenshot "$RUNNER_TEMP/none.png" 2>&1)
          code=$?
          set -e
          echo "$out"
          echo "exit code $code"
          [ "$code" -eq 1 ]
          grep -q "needs an X11 display" <<< "$out"

      - uses: actions/upload-artifact@v4
        with:
          name: FreeReader-linux
          path: dist/FreeReader-x86_64.AppImage
          retention-days: 14

  android:
    name: Android APK
    needs: version
    # The phone app (Qt Quick) for arm64 phones. It is checked and kept with the run (14 days), signed with a key
    # made for this run only (good for trying it, not for updating an installed copy); releases don't carry it yet.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_NDK_VERSION: "26.1.10909125"   # the NDK Qt 6.8 is built with
      ANDROID_ABI: arm64-v8a
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android NDK and SDK parts
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;${ANDROID_NDK_VERSION}" \
            "platforms;android-35" "build-tools;35.0.0" > /dev/null
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

      - uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: linux
          target: android
          arch: android_arm64_v8a
          autodesktop: true      # the desktop Qt that Qt for Android's build tools run on
          cache: true

      - uses: actions/cache@v4
        id: mupdf
        with:
          path: mupdf
          key: mupdf-${{ env.MUPDF_VERSION }}-android-arm64-${{ hashFiles('.github/workflows/build-apps.yml') }}

      - name: MuPDF (PDF and XPS) for Android
        if: steps.mupdf.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o mupdf.tar.gz "https://mupdf.com/downloads/archive/mupdf-${MUPDF_VERSION}-source.tar.gz"
          echo "${MUPDF_SHA256}  mupdf.tar.gz" | sha256sum -c
          tar -xzf mupdf.tar.gz
          mv "mupdf-${MUPDF_VERSION}-source" mupdf
          tc="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"
          # MuPDF's own copies of FreeType, zlib and libjpeg (Android has none to share); getentropy() is declared in
          # sys/random.h there.
          make -C mupdf -j4 OS=Android build=release OUT=build/android \
            CC="$tc/clang --target=aarch64-linux-android28" CXX="$tc/clang++ --target=aarch64-linux-android28" AR="$tc/llvm-ar" \
            html=no mujs=no brotli=no extract=no tofu=yes tofu_cjk=yes HAVE_X11=no HAVE_GLUT=no HAVE_CURL=no HAVE_LIBCRYPTO=no \
            XCFLAGS="-fPIC -DARCH_HAS_SSE=0 -include sys/random.h" libs
          find mupdf -mindepth 1 -maxdepth 1 ! -name include ! -name build -exec rm -rf {} +
          find mupdf/build/android -type f ! -name '*.a' -delete
          ls -l mupdf/build/android/*.a

      - name: OpenSSL for Android and chmlib's source
        run: |
          # HTTPS (Gemini, dictionary downloads): Android has no OpenSSL for apps; KDAB's builds, as for the local APK.
          git clone --quiet https://github.com/KDAB/android_openssl.git
          git -C android_openssl checkout --quiet b71f1470962019bd89534a2919f5925f93bc5779
          ls -l android_openssl/ssl_3/$ANDROID_ABI/libcrypto_3.so android_openssl/ssl_3/$ANDROID_ABI/libssl_3.so
          # CHM help files: chmlib (LGPL-2.1) built from its source.
          git clone --quiet https://github.com/jedwing/CHMLib.git chmlib
          git -C chmlib checkout --quiet 2bef8d063ec7d88a8de6fd9f0513ea42ac0fa21f
          ls -l chmlib/src/chm_lib.c

      - name: Build the APK
        run: |
          host="${QT_HOST_PATH:-$(dirname "$QT_ROOT_DIR")/gcc_64}"
          "$QT_ROOT_DIR/bin/qt-cmake" -S . -B build-android -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DQT_HOST_PATH="$host" -DANDROID_SDK_ROOT="$ANDROID_HOME" -DANDROID_NDK_ROOT="$ANDROID_NDK_ROOT" \
            -DRELEASE_VERSION=${{ needs.version.outputs.version }} \
            -DMUPDF_DIR="$PWD/mupdf" -DMUPDF_BUILD=build/android -DCHMLIB_SOURCE_DIR="$PWD/chmlib/src" \
            -DFREEREADER_ANDROID_OPENSSL_DIR="$PWD/android_openssl/ssl_3"
          # Every format library linked in: PDF and XPS, CHM.
          for f in HAVE_MUPDF HAVE_CHMLIB; do
            grep -q "$f" build-android/build.ninja || { echo "built without $f"; exit 1; }
          done
          cmake --build build-android --target apk
          apk=$(find build-android -name '*-release-unsigned.apk' | head -n 1)
          test -n "$apk"
          # Signed with a key made for this run (test installs only; an installed copy updates only from the same key).
          bt="$ANDROID_HOME/build-tools/35.0.0"
          keytool -genkeypair -keystore run.keystore -storepass android -keypass android -alias run \
            -dname "CN=FreeReader test" -keyalg RSA -keysize 2048 -validity 30 > /dev/null
          mkdir -p dist
          "$bt/zipalign" -f -p 4 "$apk" aligned.apk
          "$bt/apksigner" sign --ks run.keystore --ks-pass pass:android --key-pass pass:android \
            --out dist/FreeReader-android-arm64-test.apk aligned.apk
          "$bt/apksigner" verify dist/FreeReader-android-arm64-test.apk
          # The app's library, its Qt Quick screens, OpenSSL and the package name are all in the APK.
          unzip -l dist/FreeReader-android-arm64-test.apk > contents.txt
          for f in lib/$ANDROID_ABI/libFreeReader_arm64-v8a.so lib/$ANDROID_ABI/libcrypto_3.so lib/$ANDROID_ABI/libssl_3.so; do
            grep -q "$f" contents.txt || { echo "missing from the APK: $f"; grep 'lib/' contents.txt | head -n 40; exit 1; }
          done
          "$bt/aapt2" dump badging dist/FreeReader-android-arm64-test.apk | head -n 3
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: FreeReader-android-arm64
          path: dist/FreeReader-android-arm64-test.apk
          retention-days: 14

  release:
    name: Publish release
    # Every merge into main, and any v* tag pushed by hand. Pull requests and manual runs don't publish.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [version, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: v${{ needs.version.outputs.version }}
        run: |
          ls -l dist
          # For a merge this also creates the tag on the merged commit (a tag made this way doesn't start
          # another run).
          gh release create "$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "FreeReader $VERSION" --generate-notes \
            dist/FreeReader.exe dist/FreeReader-x86_64.AppImage
